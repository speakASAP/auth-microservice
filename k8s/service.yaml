apiVersion: v1
kind: Service
metadata:
  name: auth-microservice
  namespace: statex-apps
  labels:
    app: auth-microservice
    managed-by: k8s-migration
spec:
  type: ClusterIP
  selector:
    app: auth-microservice
  ports:
    - protocol: TCP
      port: 3370
      targetPort: 3370
      name: http
