apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-microservice
  namespace: statex-apps
  labels:
    app: auth-microservice
    managed-by: k8s-migration
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - auth.alfares.cz
      secretName: auth-microservice-tls
  rules:
    - host: auth.alfares.cz
      http:
        paths:
          # API backend — NestJS on 3370
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: auth-microservice
                port:
                  number: 3370
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: auth-microservice
                port:
                  number: 3370
          # Web frontend (login/register/admin UI) — Express on 3372
          - path: /
            pathType: Prefix
            backend:
              service:
                name: auth-microservice-web
                port:
                  number: 3372
