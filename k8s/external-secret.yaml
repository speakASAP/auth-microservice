apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-microservice-secret
  namespace: statex-apps
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: auth-microservice-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: secret/prod/auth-microservice
        property: DB_PASSWORD
    - secretKey: JWT_SECRET
      remoteRef:
        key: secret/prod/auth-microservice
        property: JWT_SECRET
    # TASK-KEY-F3: RS256 signing material. auth is the ecosystem's only issuer, so
    # only this service holds the private key; verifiers fetch the public key from
    # /.well-known/jwks.json and become structurally unable to mint tokens.
    - secretKey: JWT_PRIVATE_KEY
      remoteRef:
        key: secret/prod/auth-microservice
        property: JWT_PRIVATE_KEY
    - secretKey: JWT_PUBLIC_KEY
      remoteRef:
        key: secret/prod/auth-microservice
        property: JWT_PUBLIC_KEY
    - secretKey: JWT_KEY_ID
      remoteRef:
        key: secret/prod/auth-microservice
        property: JWT_KEY_ID
    - secretKey: TEST_EMAIL
      remoteRef:
        key: secret/prod/auth-microservice
        property: TEST_EMAIL
    - secretKey: TEST_PASSWORD
      remoteRef:
        key: secret/prod/auth-microservice
        property: TEST_PASSWORD
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: secret/prod/auth-microservice
        property: GOOGLE_CLIENT_ID
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef:
        key: secret/prod/auth-microservice
        property: GOOGLE_CLIENT_SECRET
    - secretKey: FACEBOOK_CLIENT_ID
      remoteRef:
        key: secret/prod/auth-microservice
        property: FACEBOOK_CLIENT_ID
    - secretKey: FACEBOOK_CLIENT_SECRET
      remoteRef:
        key: secret/prod/auth-microservice
        property: FACEBOOK_CLIENT_SECRET
    - secretKey: INTERNAL_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/auth-microservice
        property: INTERNAL_SERVICE_TOKEN
    - secretKey: TRUSTED_INTERNAL_SERVICES
      remoteRef:
        key: secret/prod/auth-microservice
        property: TRUSTED_INTERNAL_SERVICES
    # TASK-KEY-F2: was the shared SERVICE_TOKEN value (global:superadmin, 6 holders).
    # Now this service's own delivery-scoped token. Env var name unchanged so no code change.
    - secretKey: NOTIFICATION_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/auth-microservice
        property: NOTIFICATIONS_SERVICE_TOKEN

    - secretKey: JWT_TOKEN
      remoteRef:
        key: secret/prod/auth-microservice
        property: JWT_TOKEN

    # Must hold the same value as marketing-microservice's copy, or every
    # unsubscribe link in every sent marketing message fails verification.
    - secretKey: MARKETING_UNSUBSCRIBE_SECRET
      remoteRef:
        key: secret/prod/auth-microservice
        property: MARKETING_UNSUBSCRIBE_SECRET
