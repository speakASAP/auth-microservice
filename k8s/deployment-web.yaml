apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-microservice-web
  namespace: statex-apps
  labels:
    app: auth-microservice-web
    managed-by: k8s-migration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-microservice-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: auth-microservice-web
    spec:
      containers:
        - name: app
          image: localhost:5000/auth-microservice-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3372
              name: http
          env:
            - name: PORT
              value: "3372"
            - name: AUTH_BACKEND_URL
              value: "http://auth-microservice.statex-apps.svc.cluster.local:3370"
            - name: NODE_ENV
              value: "production"
          livenessProbe:
            httpGet:
              path: /health
              port: 3372
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3372
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "20m"
            limits:
              memory: "256Mi"
              cpu: "200m"
