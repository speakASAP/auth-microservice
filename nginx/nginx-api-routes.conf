# API routes for auth-microservice: /auth and /health go to frontend which proxies to backend.
# Do NOT add /auth/ or /health here - they would be misrouted to frontend_api_routes with /api prefix.
# Instead, /auth/* and /health hit location / (frontend); frontend proxies /auth to backend.
# (Empty - frontend handles /auth via proxy, nginx default handles /health for backend)
#
# Service registry is managed by nginx-microservice deploy-smart.sh (from docker-compose and this file).
