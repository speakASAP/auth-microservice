services:
  # Backend: auth API (service name "backend" for nginx routing)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-microservice-blue
    ports:
      - "${PORT:-3370}:${PORT:-3370}"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3370}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - DB_HOST=${DB_HOST:-db-server-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-dbadmin}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-auth}
      - DB_SYNC=${DB_SYNC:-false}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-30d}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOGGING_SERVICE_URL=${LOGGING_SERVICE_URL:-http://logging-microservice:${LOGGING_SERVICE_PORT:-3367}}
      - NOTIFICATIONS_SERVICE_URL=${NOTIFICATIONS_SERVICE_URL}
      - FRONTEND_URL=${FRONTEND_URL}
    volumes:
      - ${LOGS_VOLUME_PATH:-./logs}:/app/logs
    networks:
      nginx-network:
        aliases:
          - auth-microservice
    deploy:
      resources:
        limits:
          memory: 200M
          cpus: '0.5'
        reservations:
          memory: 100M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${PORT:-3370}/health"]
      interval: 10s
      timeout: 10s
      retries: 2

  # Frontend: landing + admin (served at DOMAIN on prod)
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: auth-microservice-blue-frontend
    ports:
      - "${FRONTEND_PORT_BLUE:-3380}:3380"
    env_file:
      - .env
    environment:
      - PORT=3380
      - LOGGING_SERVICE_URL=${LOGGING_SERVICE_URL}
      - AUTH_BACKEND_URL=http://auth-microservice-blue:${PORT:-3370}
    networks:
      - nginx-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3380/health"]
      interval: 10s
      timeout: 5s
      retries: 2

networks:
  nginx-network:
    external: true

