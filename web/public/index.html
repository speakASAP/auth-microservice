<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auth Service</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <div class="login-box">
      <div id="lang-switcher" class="lang-switcher" role="group" aria-label="Language">
        <button type="button" class="lang-btn" data-lang="en">EN</button>
        <button type="button" class="lang-btn" data-lang="cs">CS</button>
        <button type="button" class="lang-btn" data-lang="ru">RU</button>
      </div>
      <h2 id="auth-title">Sign in</h2>
      <p id="auth-subtitle" style="margin: 0 0 1rem 0; color: var(--muted);">Continue with your Alfares account</p>

      <div id="auth-tabs" style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
        <button id="tab-login" type="button" class="btn btn-secondary" style="flex: 1;">Login</button>
        <button id="tab-register" type="button" class="btn btn-secondary" style="flex: 1;">Register</button>
      </div>

      <form id="auth-form" onsubmit="return false;">
        <div id="name-row" style="display: none; gap: 0.5rem;">
          <div class="form-group" style="flex: 1;">
            <label id="firstName-label" for="firstName">First name</label>
            <input id="firstName" name="firstName" type="text" autocomplete="given-name">
          </div>
          <div class="form-group" style="flex: 1;">
            <label id="lastName-label" for="lastName">Last name</label>
            <input id="lastName" name="lastName" type="text" autocomplete="family-name">
          </div>
        </div>

        <div id="identifier-row" class="form-group">
          <label id="identifier-label" for="identifier">Email or phone</label>
          <input id="identifier" name="identifier" type="text" required autocomplete="username" inputmode="email">
        </div>

        <div id="phone-row" class="form-group" style="display: none;">
          <label id="phone-label" for="phone">Phone</label>
          <input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel">
        </div>

        <div id="password-row" class="form-group">
          <label id="password-label" for="password">Password</label>
          <input id="password" name="password" type="password" minlength="6" required autocomplete="current-password">
        </div>

        <!-- Marketing consent. Shown on register only, and DELIBERATELY NOT CHECKED: under GDPR
             consent is an active choice, so a pre-ticked box records evidence of nothing. It is
             also separate from accepting the terms — bundling the two would make the consent
             non-specific and equally worthless. -->
        <div id="marketing-consent-row" class="form-group" style="display: none;">
          <label for="marketing-consent" style="display:flex; gap:.6rem; align-items:flex-start; font-weight:400; cursor:pointer;">
            <input id="marketing-consent" name="marketing_consent" type="checkbox" style="margin-top:.25rem;">
            <span id="marketing-consent-text">Chci dostávat tipy, jak prodávat rychleji, a novinky ve službě.</span>
          </label>
          <!-- Stated next to the box on purpose. Operational email about someone's own account is
               performance of the contract, not marketing: it needs no consent and must not be
               withheld by ticking or not ticking this. Saying so removes the fear that refusing
               means missing something that matters. -->
          <p id="marketing-consent-note" style="margin:.45rem 0 0 1.9rem; font-size:.85rem; opacity:.75;">
            Provozní e-maily o vašem účtu a inzerátech posíláme vždy — jsou součástí služby.
            Souhlas výše můžete kdykoli odvolat.
          </p>
        </div>

        <div id="password-confirm-row" class="form-group" style="display: none;">
          <label id="password-confirm-label" for="password-confirm">Confirm new password</label>
          <input id="password-confirm" name="password-confirm" type="password" minlength="6" autocomplete="new-password">
        </div>

        <div id="contact-code-row" class="form-group" style="display: none;">
          <label id="contact-code-label" for="contact-code">Sign-in code</label>
          <input id="contact-code" name="contact-code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="6-digit code">
          <button id="verify-code-btn" type="button" class="btn btn-secondary" style="margin-left: 0; width: 100%; margin-top: 0.5rem;">Verify sign-in code</button>
        </div>

        <div id="submit-error" class="error" style="display: none;"></div>
        <div id="submit-success" class="success" style="display: none;"></div>
        <button id="submit-btn" type="submit" class="btn" disabled>Continue</button>
      </form>

      <div id="auth-links" style="margin-top: 1rem; color: var(--muted); font-size: 0.85rem;">
        <button id="magic-link-btn" type="button" class="btn btn-secondary" style="margin-left: 0; width: 100%;" disabled>Send sign-in code</button>
        <button id="reset-password-btn" type="button" class="btn btn-secondary" style="margin-left: 0; width: 100%;">Forgot password?</button>
      </div>

      <p id="reset-login-link" style="display: none; margin-top: 1rem; color: var(--muted); font-size: 0.85rem;">
        <span id="reset-login-text">Remembered your password?</span> <a id="reset-login-anchor" href="/login">Back to login</a>
      </p>
      <p id="return-url-row" style="margin-top: 1rem; color: var(--muted); font-size: 0.85rem;">
        <span id="redirect-target-label">Redirect target:</span>
        <code id="return-url-label">(not set)</code>
      </p>
      <p style="margin-top: 0.25rem; color: var(--muted); font-size: 0.85rem;">
        <span id="admin-tools-text">Need admin tools?</span> <a id="admin-link" href="/admin">Open admin panel</a>
      </p>
    </div>
  </div>

    function normalizeLang(raw) {
      if (!raw) return '';
      const primary = String(raw).trim().toLowerCase().split(/[-_]/)[0];
      return SUPPORTED_LANGS.includes(primary) ? primary : '';
    }

    function resolveLang() {
      const params = new URLSearchParams(window.location.search);
      return normalizeLang(params.get('lang'))
        || normalizeLang(localStorage.getItem(LANG_STORAGE_KEY))
        || normalizeLang(navigator.language || (navigator.languages && navigator.languages[0]))
        || 'en';
    }

    function t(key, params) {
      const dict = I18N[currentLang] || I18N.en;
      let out = dict[key] || I18N.en[key] || key;
      if (params) {
        Object.keys(params).forEach(function (name) {
          out = out.split('{' + name + '}').join(params[name]);
        });
      }
      return out;
    }

    /* Exact-match map of known English backend messages to i18n keys.
       Backend messages stay English on the wire; unknown ones display as-is. */
    const SERVER_MESSAGES = {
      'Invalid credentials': 'errInvalidCredentials',
      'User account is inactive': 'errAccountInactive',
      'User with this email already exists': 'accountExists',
      'Email is already in use': 'accountExists',
      'Invalid or expired reset token': 'invalidResetToken',
      'Reset token has expired': 'invalidResetToken',
      'Invalid or expired sign-in code': 'invalidCode',
      'Invalid return_url': 'invalidReturnUrl',
      'return_url must use HTTPS': 'invalidReturnUrl',
      'return_url is not allowed': 'invalidReturnUrl',
      'Too many requests, please try again later.': 'errTooManyRequests',
      'Identifier is required': 'enterEmailOrPhone',
      'Password must be at least 6 characters': 'passwordMinLength',
    };

    function localizeServerMessage(message) {
      if (!message) return message;
      const key = SERVER_MESSAGES[String(message).trim()];
      return key ? t(key) : message;
    }

    function buildSearchParams(extra) {
      const next = new URLSearchParams(window.location.search);
      Object.keys(extra || {}).forEach((key) => {
        const value = extra[key];
        if (value === null || value === undefined || value === '') next.delete(key);
        else next.set(key, value);
      });
      if (currentLang) next.set('lang', currentLang);
      const qs = next.toString();
      return qs ? '?' + qs : '';
    }

    function setLangInUrl(lang) {
      const path = window.location.pathname;
      const next = new URLSearchParams(window.location.search);
      next.set('lang', lang);
      window.history.replaceState(null, '', path + '?' + next.toString());
    }

    let currentLang = resolveLang();
    localStorage.setItem(LANG_STORAGE_KEY, currentLang);
    if (!new URLSearchParams(window.location.search).get('lang')) {
      setLangInUrl(currentLang);
    }

    const params = new URLSearchParams(window.location.search);
    // /set-password is an alias of the reset screen: identifier hidden, password + confirm shown.
    const resetPaths = ['/reset-password', '/set-password'];
    const initialMode = window.location.pathname === '/register'
      ? 'register'
      : (resetPaths.includes(window.location.pathname) ? 'reset' : 'login');
    const returnUrlRaw = params.get('return_url') || '';
    const state = params.get('state') || '';
    const resetToken = params.get('token') || '';
    // Display only, and backend-owned: the server puts the window it actually enforces here.
    let recoveryTtlMinutes = params.get('ttl') || '';
    const clientId = params.get('client_id') || '';
    const prefillIdentifier = params.get('login_hint') || params.get('identifier') || params.get('email') || params.get('phone') || '';
    const prefillEmail = params.get('email') || (prefillIdentifier.includes('@') ? prefillIdentifier : '');
    const prefillPhone = params.get('phone') || (!prefillIdentifier.includes('@') ? prefillIdentifier : '');
    const marathonPhoneRequired = clientId === 'marathon';

    const authTitle = document.getElementById('auth-title');
    const authSubtitle = document.getElementById('auth-subtitle');
    const authTabs = document.getElementById('auth-tabs');
    const nameRow = document.getElementById('name-row');
    const phoneRow = document.getElementById('phone-row');
    const identifierRow = document.getElementById('identifier-row');
    const identifierLabel = document.getElementById('identifier-label');
    const identifierInput = document.getElementById('identifier');
    const phoneInput = document.getElementById('phone');
    const passwordLabel = document.getElementById('password-label');
    const passwordRow = document.getElementById('password-row');
    const passwordInput = document.getElementById('password');
    const passwordConfirmRow = document.getElementById('password-confirm-row');
    const passwordConfirmInput = document.getElementById('password-confirm');
    const contactCodeRow = document.getElementById('contact-code-row');
    const contactCodeInput = document.getElementById('contact-code');
    const verifyCodeBtn = document.getElementById('verify-code-btn');
    const form = document.getElementById('auth-form');
    const submitBtn = document.getElementById('submit-btn');
    const submitError = document.getElementById('submit-error');
    const submitSuccess = document.getElementById('submit-success');
    const returnUrlLabel = document.getElementById('return-url-label');
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const magicLinkBtn = document.getElementById('magic-link-btn');
    const resetPasswordBtn = document.getElementById('reset-password-btn');
    const authLinks = document.getElementById('auth-links');
    const resetLoginLink = document.getElementById('reset-login-link');
    const returnUrlRow = document.getElementById('return-url-row');
    let contactCodeRequestedFor = '';
    let recoveryRequested = false;

    let mode = initialMode;
    let validatedReturnUrl = '';

    function applyI18n(lang) {
      currentLang = normalizeLang(lang) || 'en';
      localStorage.setItem(LANG_STORAGE_KEY, currentLang);
      document.documentElement.lang = currentLang;
      document.title = t('pageTitle');
      document.querySelectorAll('.lang-btn').forEach((btn) => {
        btn.classList.toggle('lang-btn-active', btn.getAttribute('data-lang') === currentLang);
      });
      document.getElementById('firstName-label').textContent = t('firstName');
      document.getElementById('lastName-label').textContent = t('lastName');
      document.getElementById('phone-label').textContent = t('phone');
      document.getElementById('password-confirm-label').textContent = t('confirmNewPassword');
      document.getElementById('contact-code-label').textContent = t('signInCode');
      contactCodeInput.placeholder = t('codePlaceholder');
      verifyCodeBtn.textContent = t('verifySignInCode');
      tabLogin.textContent = t('tabLogin');
      tabRegister.textContent = t('tabRegister');
      magicLinkBtn.textContent = t('sendSignInCode');
      resetPasswordBtn.textContent = t('forgotPassword');
      document.getElementById('reset-login-text').textContent = t('rememberedPassword');
      document.getElementById('reset-login-anchor').textContent = t('backToLogin');
      document.getElementById('redirect-target-label').textContent = t('redirectTarget');
      document.getElementById('admin-tools-text').textContent = t('needAdmin');
      document.getElementById('admin-link').textContent = t('openAdmin');
      if (!validatedReturnUrl && !returnUrlRaw) {
        returnUrlLabel.textContent = t('notSet');
      } else if (!validatedReturnUrl && returnUrlRaw) {
        returnUrlLabel.textContent = t('requiredByApp');
      }
      syncMode();
    }

    function applyPrefill() {
      if (mode === 'register') {
        if (prefillEmail && !identifierInput.value) {
          identifierInput.value = prefillEmail;
        }
        if (prefillPhone && !phoneInput.value) {
          phoneInput.value = prefillPhone;
        }
        return;
      }
      if (prefillIdentifier && !identifierInput.value) {
        identifierInput.value = prefillIdentifier;
      }
    }

    function parseJwtExpiryIso(accessToken) {
      try {
        const payload = JSON.parse(atob(accessToken.split('.')[1]));
        if (!payload.exp) return '';
        return new Date(payload.exp * 1000).toISOString();
      } catch {
        return '';
      }
    }

    function isEmail(value) {
      return value.includes('@');
    }

    function setError(message) {
      const localized = localizeServerMessage(message);
      submitError.style.display = localized ? 'block' : 'none';
      submitError.textContent = localized || '';
    }

    function setSuccess(message) {
      submitSuccess.style.display = message ? 'block' : 'none';
      submitSuccess.textContent = message || '';
    }

    function buildTokenHandoffUrl(returnUrl, data, callerState) {
      const redirectUrl = new URL(returnUrl);
      const fragment = new URLSearchParams();
      fragment.set('access_token', data.accessToken);
      if (data.refreshToken) fragment.set('refresh_token', data.refreshToken);
      const expiresAt = parseJwtExpiryIso(data.accessToken);
      if (expiresAt) fragment.set('expires_at', expiresAt);
      if (callerState) fragment.set('state', callerState);
      fragment.set('auth_method', 'password');
      redirectUrl.hash = fragment.toString();
      return redirectUrl.toString();
    }

    function syncMode() {
      const isRegister = mode === 'register';
      const isReset = mode === 'reset';
      authTitle.textContent = isReset ? t('resetPassword') : (isRegister ? t('createAccount') : t('signIn'));
      authSubtitle.textContent = isReset
        ? (recoveryTtlMinutes ? t('setPasswordWindow', { minutes: recoveryTtlMinutes }) : t('subtitleReset'))
        : (isRegister
          ? (marathonPhoneRequired ? t('subtitleRegisterMarathon') : t('subtitleRegister'))
          : t('subtitleLogin'));
      authTabs.style.display = isReset ? 'none' : 'flex';
      nameRow.style.display = isRegister ? 'flex' : 'none';
      phoneRow.style.display = isRegister ? 'block' : 'none';
      // Register only. Asking a returning user to consent again on every login would be nagging,
      // not consent, and the evidence already exists for anyone who said yes.
      var marketingRow = document.getElementById('marketing-consent-row');
      if (marketingRow) marketingRow.style.display = isRegister ? 'block' : 'none';
      identifierRow.style.display = isReset ? 'none' : 'block';
      phoneInput.required = isRegister && marathonPhoneRequired;
      identifierInput.required = !isReset;
      passwordRow.style.display = 'block';
      passwordConfirmRow.style.display = isReset ? 'block' : 'none';
      passwordConfirmInput.required = isReset;
      passwordLabel.textContent = isReset ? t('newPassword') : t('password');
      identifierLabel.textContent = isRegister ? t('email') : t('emailOrPhone');
      identifierInput.type = isRegister ? 'email' : 'text';
      identifierInput.autocomplete = isRegister ? 'email' : 'username';
      identifierInput.inputMode = isRegister ? 'email' : 'text';
      passwordInput.autocomplete = isRegister || isReset ? 'new-password' : 'current-password';
      submitBtn.textContent = isReset ? t('resetPassword') : (isRegister ? t('register') : t('login'));
      submitBtn.style.display = 'block';
      submitBtn.disabled = !isReset && !validatedReturnUrl;
      magicLinkBtn.disabled = !validatedReturnUrl;
      authLinks.style.display = isRegister || isReset ? 'none' : 'block';
      resetLoginLink.style.display = isReset ? 'block' : 'none';
      const resetLoginAnchor = document.getElementById('reset-login-anchor');
      if (resetLoginAnchor) {
        const loginParams = new URLSearchParams();
        if (returnUrlRaw) loginParams.set('return_url', returnUrlRaw);
        if (clientId) loginParams.set('client_id', clientId);
        if (state) loginParams.set('state', state);
        if (currentLang) loginParams.set('lang', currentLang);
        resetLoginAnchor.href = loginParams.toString() ? `/login?${loginParams.toString()}` : '/login';
      }
      returnUrlRow.style.display = isReset ? 'none' : 'block';
      contactCodeRow.style.display = isRegister || isReset || !contactCodeRequestedFor ? 'none' : 'block';
      if (!isReset) applyPrefill();
      tabLogin.classList.toggle('btn-secondary', isRegister);
      tabRegister.classList.toggle('btn-secondary', !isRegister);
    }

    function gotoMode(nextMode) {
      mode = nextMode;
      setError('');
      setSuccess('');
      contactCodeRequestedFor = '';
      contactCodeInput.value = '';
      contactCodeRow.style.display = 'none';
      const targetPath = nextMode === 'register' ? '/register' : '/login';
      window.history.replaceState(null, '', targetPath + buildSearchParams());
      syncMode();
    }

    function switchLang(lang) {
      const next = normalizeLang(lang) || 'en';
      if (next === currentLang) return;
      setLangInUrl(next);
      applyI18n(next);
    }

    async function validateReturnUrl() {
      if (mode === 'reset') {
        return;
      }
      if (!returnUrlRaw) {
        returnUrlLabel.textContent = t('requiredByApp');
        submitBtn.disabled = true;
        magicLinkBtn.disabled = true;
        return;
      }

      try {
        const response = await fetch('/auth/validate-return-url?return_url=' + encodeURIComponent(returnUrlRaw));
        if (!response.ok) {
          const body = await response.json().catch(() => ({ message: t('invalidReturnUrl') }));
          throw new Error(body.message || t('invalidReturnUrl'));
        }
        const data = await response.json();
        validatedReturnUrl = data.return_url;
        returnUrlLabel.textContent = validatedReturnUrl;
        submitBtn.disabled = false;
        magicLinkBtn.disabled = false;
      } catch (error) {
        setError(error.message || t('invalidReturnUrl'));
        submitBtn.disabled = true;
        magicLinkBtn.disabled = true;
      }
    }

    async function submitAuth(event) {
      event.preventDefault();
      setError('');
      setSuccess('');
      if (mode === 'reset') {
        await submitPasswordReset();
        return;
      }
      if (!validatedReturnUrl) {
        setError(t('invalidReturnUrl'));
        return;
      }

      submitBtn.disabled = true;
      const identifier = identifierInput.value.trim();
      const password = passwordInput.value;
      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const phone = phoneInput.value.trim();
      // Read at submit time, never remembered across renders: the answer must be the one this
      // person just gave.
      function marketingConsentChecked() {
        var box = document.getElementById('marketing-consent');
        return Boolean(box && box.checked);
      }

      if (mode === 'register' && marathonPhoneRequired && !phone) {
        setError(t('phoneRequiredMarathon'));
        submitBtn.disabled = false;
        return;
      }

      const endpoint = mode === 'register' ? '/auth/register' : '/auth/login';
      // `state` is forwarded on register so the caller's opaque handle reaches
      // auth.user.registered.v1 and the registration can be tied back to the journey that
      // produced it (C-005 §2.2b). The magic-link and contact-code flows already pass it; without
      // it here, every password registration arrives with no correlationId and is unattributable
      // — which would look like a join bug downstream rather than a missing form field.
      // Not sent on login: a login is not a registration and emits no event.
      const payload = mode === 'register'
        ? { email: identifier, password, firstName: firstName || undefined, lastName: lastName || undefined, phone: phone || undefined, client_id: clientId || undefined, return_url: validatedReturnUrl, state: state || undefined, marketing_consent: marketingConsentChecked() }
        : { identifier, password, client_id: clientId || undefined, return_url: validatedReturnUrl };

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        if (!response.ok) {
          const body = await response.json().catch(() => ({ message: t('authFailed') }));
          const message = body.message || t('authFailed');
          if (response.status === 409 && mode === 'register') {
            throw new Error(t('accountExists'));
          }
          throw new Error(message);
        }

        const data = await response.json();
        if (!data.accessToken) {
          throw new Error(t('missingAccessToken'));
        }

        window.location.assign(buildTokenHandoffUrl(validatedReturnUrl, data, state));
      } catch (error) {
        setError(error.message || t('authFailed'));
        submitBtn.disabled = false;
      }
    }

    async function submitPasswordReset() {
      if (!resetToken) {
        setError(t('invalidResetToken'));
        return;
      }
      const newPassword = passwordInput.value;
      const confirmPassword = passwordConfirmInput.value;
      if (!newPassword || newPassword.length < 6) {
        setError(t('passwordMinLength'));
        return;
      }
      if (newPassword !== confirmPassword) {
        setError(t('passwordsMismatch'));
        return;
      }
      submitBtn.disabled = true;
      try {
        const response = await fetch('/auth/password-reset-confirm', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: resetToken, newPassword }),
        });
        if (!response.ok) {
          const body = await response.json().catch(() => ({ message: t('resetFailed') }));
          throw new Error(body.message || t('resetFailed'));
        }
        const data = await response.json().catch(() => ({}));
        passwordInput.value = '';
        passwordConfirmInput.value = '';
        // The whole point of recovery: finish on the page the user originally wanted.
        if (data.redirectUrl) {
          setSuccess(t('passwordUpdatedRedirecting'));
          window.location.assign(data.redirectUrl);
          return;
        }
        passwordRow.style.display = 'none';
        passwordConfirmRow.style.display = 'none';
        submitBtn.style.display = 'none';
        setSuccess(t('resetSuccess'));
      } catch (error) {
        setError(error.message || t('resetFailed'));
        submitBtn.disabled = false;
      }
    }

    async function requestMagicLink() {
      setError('');
      setSuccess('');
      const identifier = identifierInput.value.trim();
      if (!validatedReturnUrl) {
        setError(t('invalidReturnUrl'));
        return;
      }
      if (!identifier) {
        setError(t('enterEmailOrPhone'));
        return;
      }
      magicLinkBtn.disabled = true;
      try {
        const response = await fetch('/auth/contact-code/request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            identifier,
            return_url: validatedReturnUrl,
            client_id: clientId || undefined,
            state: state || undefined,
            app_domain: window.location.hostname,
            lang: currentLang,
          }),
        });
        if (!response.ok) {
          const body = await response.json().catch(() => ({ message: t('codeRequestFailed') }));
          throw new Error(body.message || t('codeRequestFailed'));
        }
        contactCodeRequestedFor = identifier;
        contactCodeInput.value = '';
        contactCodeRow.style.display = 'block';
        contactCodeInput.focus();
        setSuccess(t('codeSent'));
      } catch (error) {
        setError(error.message || t('codeFlowFailed'));
      } finally {
        magicLinkBtn.disabled = false;
      }
    }

    async function verifyContactCode() {
      setError('');
      setSuccess('');
      const code = contactCodeInput.value.trim();
      if (!validatedReturnUrl) {
        setError(t('invalidReturnUrl'));
        return;
      }
      if (!contactCodeRequestedFor) {
        setError(t('requestCodeFirst'));
        return;
      }
      if (!/^\d{6}$/.test(code)) {
        setError(t('enterSixDigitCode'));
        return;
      }
      verifyCodeBtn.disabled = true;
      try {
        const verifyResponse = await fetch('/auth/contact-code/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            identifier: contactCodeRequestedFor,
            code,
            return_url: validatedReturnUrl,
            client_id: clientId || undefined,
            purpose: recoveryRequested ? 'recovery' : undefined,
            lang: currentLang,
          }),
        });
        if (!verifyResponse.ok) {
          const body = await verifyResponse.json().catch(() => ({ message: t('invalidCode') }));
          throw new Error(body.message || t('invalidCode'));
        }
        const data = await verifyResponse.json();
        // Recovery hands back no tokens - only a one-time grant to set a password.
        if (data.recovery) {
          window.location.assign(data.redirectUrl);
          return;
        }
        window.location.assign(data.redirectUrl || buildTokenHandoffUrl(validatedReturnUrl, data, state));
      } catch (error) {
        setError(error.message || t('verifyFailed'));
      } finally {
        verifyCodeBtn.disabled = false;
      }
    }

    async function requestPasswordReset() {
      setError('');
      setSuccess('');
      const identifier = identifierInput.value.trim();
      if (!validatedReturnUrl) {
        setError(t('invalidReturnUrl'));
        return;
      }
      if (!identifier) {
        setError(t('enterEmailOrPhone'));
        return;
      }
      resetPasswordBtn.disabled = true;
      try {
        const response = await fetch('/auth/contact-code/request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            identifier,
            return_url: validatedReturnUrl,
            client_id: clientId || undefined,
            state: state || undefined,
            app_domain: window.location.hostname,
            lang: currentLang,
            purpose: 'recovery',
          }),
        });
        if (!response.ok) {
          const body = await response.json().catch(() => ({ message: t('codeRequestFailed') }));
          throw new Error(body.message || t('codeRequestFailed'));
        }
        const data = await response.json();
        recoveryTtlMinutes = data.ttlMinutes;
        contactCodeRequestedFor = identifier;
        recoveryRequested = true;
        contactCodeInput.value = '';
        contactCodeRow.style.display = 'block';
        contactCodeInput.focus();
        setSuccess(t('recoveryCodeSent', { minutes: data.ttlMinutes }));
      } catch (error) {
        setError(error.message || t('codeFlowFailed'));
      } finally {
        resetPasswordBtn.disabled = false;
      }
    }

    document.querySelectorAll('.lang-btn').forEach((btn) => {
      btn.addEventListener('click', () => switchLang(btn.getAttribute('data-lang')));
    });
    tabLogin.addEventListener('click', () => gotoMode('login'));
    tabRegister.addEventListener('click', () => gotoMode('register'));
    magicLinkBtn.addEventListener('click', requestMagicLink);
    verifyCodeBtn.addEventListener('click', verifyContactCode);
    resetPasswordBtn.addEventListener('click', requestPasswordReset);
    form.addEventListener('submit', submitAuth);

    applyI18n(currentLang);
    validateReturnUrl();
  </script>
</body>
</html>
